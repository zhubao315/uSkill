site_name: uSkill
site_url: https://zhubao315.github.io/uSkill/
site_description: uSkill - Agent Skill Engineering Platform (open standards, governed runtime, evidence-based evolution)
repo_url: https://github.com/zhubao315/uSkill
repo_name: zhubao315/uSkill
site_author: zhubao315

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  
  # Logo configuration
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.share
    - toc.follow
    - announce.dismiss

  palette:
    # Light mode
    - scheme: default
      primary: custom blue
      accent: custom teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - scheme: slate
      primary: custom blue
      accent: custom teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

# Custom color scheme based on design specs
extra:
  palette:
    primary: "#005FB8"  # Engineering Blue
    accent: "#00C2CB"   # Intelligent Teal
    accent2: "#FF8C00"  # Activation Orange
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhubao315
      name: GitHub

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  # Standard extensions
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
      # Unicode-preserving anchors; matches core/uskills/indexer.py _anchor()
      # so generated skill-catalog nav links resolve for CJK headings.
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  
  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  
  # Other extensions
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 入门:
      - 快速开始: quickstart.md
      - 从 1.x 迁移到 2.0: migration.md
  - 概念与架构:
      - 架构: architecture.md
      - Schema: schema.md
      - Agent Skills 标准: agent-skills.md
      - Skill Builder: builder.md
      - 运行时: runtime.md
  - 指南:
      - 评测与治理: evaluation.md
      - Registry 与分发: distribution.md
      - 技能分类: skills.md
      - 驾驭示例: skill-creator-case.md
      - 技能库: generated/skills-index.md
  - 参考:
      - CLI 参考: cli.md
      - Roadmap: roadmap.md
      - 2.0 演进计划: ROADMAP_2.0.md
      - 审计报告 · 仓库: audit/REPOSITORY_AUDIT.md
      - 审计报告 · 项目: audit/PROJECT_AUDIT.md
      - 审计报告 · 架构: audit/ARCHITECTURE_AUDIT.md
      - 审计报告 · 安全: audit/SECURITY_AUDIT.md
      - 审计报告 · 测试覆盖: audit/TEST_COVERAGE_AUDIT.md
      - 审计报告 · 生态对比: audit/ECOSYSTEM_COMPARISON.md
