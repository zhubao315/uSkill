name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy core/ --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,workbench]"
      - name: Schema is up to date
        run: |
          python cli/uskills_cli.py schema --target both \
            --output /tmp/skill.json --manifest-output /tmp/manifest.json
          diff /tmp/skill.json standards/uskill.schema.json
          diff /tmp/manifest.json standards/uskill-manifest.schema.json
      - name: Skills assets valid
        run: |
          python cli/uskills_cli.py validate skills/
          python cli/uskills_cli.py doctor
      - name: Generate index and skills pass
        run: |
          python cli/uskills_cli.py index skills --output /tmp/skills-index.md
      - name: Eval regression gate (deterministic mock, no API key)
        run: |
          MOCK='{"summary":"s","key_points":["k"],"translated_text":"t","detected_source_lang":"zh","confidence":0.9,"keywords":["w"],"translation":"tr","processing_time":"1s","result":"r"}'
          python cli/uskills_cli.py eval \
            --skill skills/atomic/text_summarize.yaml \
            --suite evals/datasets/uskill-atomic-text-summarize-v1-1-0.suite.json \
            --mock-response "$MOCK" \
            --compare evals/reports/text_summarize.mock-baseline.json --gate
          python cli/uskills_cli.py eval \
            --skill skills/atomic/text_translate.yaml \
            --suite evals/datasets/uskill-atomic-text-translate-v1-1-0.suite.json \
            --mock-response "$MOCK" \
            --compare evals/reports/text_translate.mock-baseline.json --gate
      - name: Pytest with coverage
        run: pytest --cov=core --cov=cli --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Build & Install Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          uskills --version
          uskills doctor
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs (strict)
        run: mkdocs build --strict

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[llm]"
          pip-audit -r requirements.txt --skip-editable
  Frontend:
    name: Frontend (Workbench)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workbench/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test -- --run

